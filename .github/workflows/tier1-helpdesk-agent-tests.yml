name: tier1-helpdesk-agent-tests

on:
  push:
    paths: ["agents/tier1-helpdesk-agent/**", ".github/workflows/tier1-helpdesk-agent-tests.yml"]
  pull_request:
    paths: ["agents/tier1-helpdesk-agent/**", ".github/workflows/tier1-helpdesk-agent-tests.yml"]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agents/tier1-helpdesk-agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q
