# Runs the growth agent in the cloud so you never have to open a social app.
#
# One-time setup (Settings -> Secrets and variables -> Actions):
#   Secrets:   ANTHROPIC_API_KEY, AYRSHARE_API_KEY (or GROWTH_AGENT_WEBHOOK_URL)
#   Variables: GROWTH_AGENT_ENABLED=true      turns on the hourly autopilot
#              GROWTH_AGENT_PUBLISHER=ayrshare (or webhook; default: profile.yaml)
#
# Run any command by hand from the Actions tab (works from the GitHub phone app):
#   "Run workflow" -> command: brainstorm --count 10  |  launch <idea-id>  |  ideas ...
name: growth-agent

on:
  schedule:
    - cron: "17 * * * *"          # hourly: publish due posts, refill the queue
  workflow_dispatch:
    inputs:
      command:
        description: "Command, e.g. 'brainstorm --count 10', 'launch <id>', 'ideas', 'queue'"
        required: true
        default: autopilot

permissions:
  contents: write

concurrency:
  group: growth-agent            # never run two at once: avoids double posting
  cancel-in-progress: false

jobs:
  run:
    if: github.event_name == 'workflow_dispatch' || vars.GROWTH_AGENT_ENABLED == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agents/growth_agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: agents/growth_agent/requirements.txt
      - run: pip install -r requirements.txt
      - name: Run agent
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          AYRSHARE_API_KEY: ${{ secrets.AYRSHARE_API_KEY }}
          GROWTH_AGENT_WEBHOOK_URL: ${{ secrets.GROWTH_AGENT_WEBHOOK_URL }}
          GROWTH_AGENT_WEBHOOK_SECRET: ${{ secrets.GROWTH_AGENT_WEBHOOK_SECRET }}
          GROWTH_AGENT_PUBLISHER: ${{ vars.GROWTH_AGENT_PUBLISHER }}
          COMMAND: ${{ github.event.inputs.command || 'autopilot' }}
        run: |
          # Word-split the command into args without letting the shell evaluate it.
          read -r -a ARGS <<< "$COMMAND"
          python -m growth_agent "${ARGS[@]}" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Save agent memory (ideas, launch kits, post history)
        run: |
          git config user.name "growth-agent"
          git config user.email "growth-agent@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "growth-agent: ${{ github.event.inputs.command || 'autopilot' }}"
          git pull --rebase --quiet && git push
