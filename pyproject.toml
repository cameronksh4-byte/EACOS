[project]
name = "auditgate"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.11.0",
    "fastapi>=0.142.2",
    "httpx>=0.28.1",
    "instructor>=1.17.0",
    "langgraph>=1.2.13",
    "langgraph-checkpoint-sqlite>=3.1.1",
    "mcp>=2.3.0",
    "openai>=3.3.0",
    "openpyxl>=3.1.5",
    "opentelemetry-api>=1.45.0",
    "opentelemetry-sdk>=1.45.0",
    "pandas>=3.0.6",
    "pdfplumber>=0.11.10",
    "pydantic>=2.0",
    "python-dotenv>=1.2.4",
    "rich>=14.3.4",
    "spacy>=3.8.16",
    "streamlit>=1.65.0",
    "typer>=0.27.2",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pyyaml>=6.0.3",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
