name: growth-agent-tests

on:
  push:
    paths: ["agents/growth_agent/**", ".github/workflows/growth-agent*.yml"]
  pull_request:
    paths: ["agents/growth_agent/**", ".github/workflows/growth-agent*.yml"]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agents/growth_agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
