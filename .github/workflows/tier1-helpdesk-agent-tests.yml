name: tier1-helpdesk-agent-tests

on:
  push:
    paths: ["agents/tier1-helpdesk-agent/**", ".github/workflows/tier1-helpdesk-agent-tests.yml"]
  pull_request:
    paths: ["agents/tier1-helpdesk-agent/**", ".github/workflows/tier1-helpdesk-agent-tests.yml"]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agents/tier1-helpdesk-agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q

  schema:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
    defaults:
      run:
        working-directory: agents/tier1-helpdesk-agent
    steps:
      - uses: actions/checkout@v4
      - name: Apply migration (twice, to prove it is idempotent) and run SQL checks
        run: |
          psql -v ON_ERROR_STOP=1 -q -f supabase/tests/supabase_stub.sql
          psql -v ON_ERROR_STOP=1 -q -f supabase/migrations/001_init_schema.sql
          psql -v ON_ERROR_STOP=1 -q -f supabase/migrations/001_init_schema.sql
          psql -v ON_ERROR_STOP=1 -f supabase/tests/001_init_schema_test.sql | tee out.txt
          grep -q "ALL SCHEMA CHECKS PASSED" out.txt
