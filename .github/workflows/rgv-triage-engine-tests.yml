name: rgv-triage-engine-tests

on:
  push:
    paths: ["services/rgv_triage_engine/**", ".github/workflows/rgv-triage-engine-tests.yml"]
  pull_request:
    paths: ["services/rgv_triage_engine/**", ".github/workflows/rgv-triage-engine-tests.yml"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/rgv_triage_engine
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: ruff check triage_engine tests
      - run: ruff format --check triage_engine tests
      - run: mypy triage_engine
      - run: python -m pytest
        env:
          TRIAGE_TEST_PG_ADMIN_URL: postgresql://postgres:postgres@localhost:5432/postgres
